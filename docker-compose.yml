version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: azoka-postgres
    environment:
      POSTGRES_USER: azoka
      POSTGRES_PASSWORD: azoka
      POSTGRES_DB: medusa-azoka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  ta:postgres_da